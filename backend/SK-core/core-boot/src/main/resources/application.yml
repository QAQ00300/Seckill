    # Redis 配置
    redis:
      host: localhost
      port: 6379
      password:
      database: 0
      timeout: 5s
      lettuce:
        pool:
          max-active: 20
          max-idle: 10
          min-idle: 5
          max-wait: 3s

# Feign 配置
feign:
  client:
    config:
      default:
        connectTimeout: 5000
        readTimeout: 10000
  compression:
    request:
      enabled: true
    response:
      enabled: true

# MyBatis-Plus 配置
mybatis-plus:
  type-aliases-package: com.seckill.core.seckill.model,com.seckill.core.stock.model
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

# 缓存配置
# 缓存配置（阶段 2 启用 Redis）
seckill:
  cache:
    enabled: true
    type: redis

# 消息队列配置
  mq:
    enabled: true
    type: rocketmq

# RocketMQ配置
rocketmq:
  name-server: localhost:9876
  producer:
    group: seckill-producer-group
  consumer:
    group: seckill-consumer-group

# 秒杀业务配置
sk:
  seckill:
    enabled: true
    strategy: sync
    max-quantity: 10
    user-rate-limit: 60
    ip-rate-limit: 30
    risk-control-enabled: false
    validate-user-enabled: true
    validate-stock-enabled: true
    timeout: 5000
    retry-count: 0

# 服务器配置
server:
  port: 8081
