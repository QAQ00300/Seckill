# 应用基础配置
spring:
  application:
    name: SK-core

  datasource:
    url: jdbc:mysql://localhost:3306/seckill?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: Ppg123456
    driver-class-name: com.mysql.cj.jdbc.Driver

  cloud:
    nacos:
      discovery:
        server-addr: 127.0.0.1:8848
        namespace: public
        group: DEFAULT_GROUP
    loadbalancer:
      enabled: false

# Feign 配置
feign:
  client:
    config:
      default:
        connectTimeout: 5000
        readTimeout: 10000
  compression:
    request:
      enabled: true
    response:
      enabled: true

# MyBatis-Plus 配置
mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.seckill.core.seckill.model,com.seckill.core.stock.model
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

# 缓存配置（阶段 1 不启用）
seckill:
  cache:
    enabled: false
    type: none

# 消息队列配置（阶段 1 不启用）

  mq:
    enabled: false
    type: none

# 秒杀业务配置
sk:
  seckill:
    enabled: true
    strategy: sync
    max-quantity: 10
    user-rate-limit: 60
    ip-rate-limit: 30
    risk-control-enabled: false
    validate-user-enabled: true
    validate-stock-enabled: true
    timeout: 5000
    retry-count: 0

# 服务器配置
server:
  port: 8080
  servlet:
    context-path: /