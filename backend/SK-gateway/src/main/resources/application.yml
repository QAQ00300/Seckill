server:
  port: 8080
  tomcat:
    connection-timeout: 5000
    max-connections: 8192
    threads:
      max: 200
      min-spare: 10

spring:
  profiles:
    active: stage1  # 默认阶段1
  config:
    import: optional:nacos:sk-gateway.yaml

  # Redis配置（用于限流）
  data:
    redis:
      host: 127.0.0.1
      port: 6379
      database: 0
      timeout: 3000


  cloud:
    nacos:
      discovery:
        server-addr: 127.0.0.1:8848
        namespace: public
        group: DEFAULT_GROUP

      config:
        server-addr: 127.0.0.1:8848
        file-extension: yaml
        namespace: public
        group: DEFAULT_GROUP
        prefix: SK-gateway
        refresh-enabled: true
        import-check:
          enabled: false

    gateway:
      # 全局超时配置
      httpclient:
        connect-timeout: 3000
        response-timeout: 5000
        pool:
          type: elastic
          max-connections: 1000
          max-idle-time: 30000

      # 路由配置
      routes:
        # 网关管理接口
        - id: gateway-query
          uri: no://op
          predicates: Path=/gateway/query/**

        - id: gateway-mutation
          uri: no://op
          predicates: Path=/gateway/mutation/**

        # 用户服务路由 - 按请求类型分离
        - id: SK-user-query
          uri: lb://sk-user
          predicates: Path=/api/user/query/**
          filters:
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 1000
                redis-rate-limiter.burstCapacity: 2000
            - StripPrefix=2

        - id: SK-user-mutation
          uri: lb://sk-user
          predicates: Path=/api/user/mutation/**
          filters:
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 500
                redis-rate-limiter.burstCapacity: 1000
            - StripPrefix=2

        # 订单服务路由 - 按请求类型分离
        - id: SK-order-query
          uri: lb://sk-order
          predicates: Path=/api/order/query/**
          filters:
            - StripPrefix=2

        - id: SK-order-mutation
          uri: lb://sk-order
          predicates: Path=/api/order/mutation/**
          filters:
            - StripPrefix=2

        # 秒杀订单服务路由 - 按请求类型分离
        - id: SK-seckill-order-query
          uri: lb://sk-order
          predicates: Path=/api/order/seckill/query/**
          filters:
            - StripPrefix=3

        - id: SK-seckill-order-mutation
          uri: lb://sk-order
          predicates: Path=/api/order/seckill/mutation/**
          filters:
            - StripPrefix=3

        # 秒杀核心服务路由
        - id: SK-core
          uri: lb://sk-core
          predicates: Path=/api/core/**
          filters:
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 500
                redis-rate-limiter.burstCapacity: 1000
            - StripPrefix=1



# 日志配置
logging:
  level:
    com.sk.gateway: INFO
    org.springframework.cloud.gateway: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
  file:
    name: logs/gateway.log
    max-size: 100MB
    max-history: 7

# 监控配置
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,gateway
  endpoint:
    gateway:
      enabled: true
    health:
      show-details: always

# Resilience4j 配置
resilience4j:
  circuitbreaker:
    configs:
      default:
        # 滑动窗口大小（统计最近 10 次调用）
        slidingWindowSize: 10
        # 最小调用次数（达到 5 次才开始统计）
        minimumNumberOfCalls: 5
        # 失败率阈值（超过 50% 失败率则熔断）
        failureRateThreshold: 50
        # 熔断后等待 10 秒自动进入半开状态
        waitDurationInOpenState: 10s
        # 半开状态允许通过的请求数
        permittedNumberOfCallsInHalfOpenState: 3
        # 自动从半开状态过渡到关闭状态
        automaticTransitionFromOpenToHalfOpenEnabled: true
        # 记录哪些异常
        recordExceptions:
          - java.io.IOException
          - java.util.concurrent.TimeoutException
          - org.springframework.web.reactive.function.client.WebClientException
    instances:
      userCircuitBreaker:
        baseConfig: default
      orderCircuitBreaker:
        baseConfig: default
      seckillCircuitBreaker:
        baseConfig: default
        # 秒杀服务更严格：30% 失败率就熔断
        failureRateThreshold: 30
        # 更快恢复：5 秒后就尝试
        waitDurationInOpenState: 5s

  timelimiter:
    configs:
      default:
        # 默认超时时间 3 秒
        timeoutDuration: 3s
    instances:
      userCircuitBreaker:
        baseConfig: default
      orderCircuitBreaker:
        baseConfig: default
      seckillCircuitBreaker:
        baseConfig: default
        # 秒杀服务超时更短：2 秒
        timeoutDuration: 2s


# 网关自定义配置
sk:
  gateway:
    # 限流配置
    rate-limit:
      enabled: true
      default-limit: 100
      default-window: 1
    # 请求日志配置
    request-log:
      enabled: true                    # 是否启用请求日志
      max-body-length: 1000            # 请求体最大记录长度（字符）
      include-methods:                 # 记录哪些 HTTP 方法的请求体
        - POST
        - PUT
        - PATCH                        # 可以添加更多
      exclude-paths:                   # 排除的路径前缀
        - /actuator
        - /swagger
        - /api-docs
        - /favicon.ico
        - /gateway                     # 排除网关自身接口
        - /health