services:

  # ========== Nacos 服务发现与配置中心 ==========
  nacos:
    image: nacos/nacos-server:v2.2.0
    container_name: nacos
    environment:
      # 单机模式运行（适合开发和测试）
      - MODE=standalone
      # 使用内嵌 Derby 数据库存储配置（无需额外 MySQL）
      - SPRING_DATASOURCE_PLATFORM=derby
      # JVM 内存配置
      - JAVA_OPTS=-Xms256m -Xmx256m -Xmn128m
    ports:
      # Nacos 控制台访问端口
      - "8848:8848"
      # gRPC 通信端口（Nacos 2.x 需要）
      - "9848:9848"
      - "9849:9849"
    volumes:
      # 持久化 Nacos 数据
      - nacos-data:/home/nacos/data
    networks:
      - sk-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8848/nacos/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  sk-gateway:
    build:
      context: ../SK-gateway
      dockerfile: Dockerfile
    container_name: SK-gateway
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - SPRING_CLOUD_NACOS_DISCOVERY_SERVER_ADDR=host.docker.internal:8848
      - SPRING_CLOUD_NACOS_CONFIG_SERVER_ADDR=host.docker.internal:8848
      - SPRING_DATASOURCE_REDIS_HOST=redis
      - SPRING_DATASOURCE_REDIS_PORT=6379
      - JAVA_OPTS=-Xmx256m -Xms256m -Duser.timezone=Asia/Shanghai
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - sk-network
    restart: unless-stopped

  sk-user:
    build:
      context: ../SK-user/user-boot
      dockerfile: Dockerfile
    container_name: SK-user
    ports:
      - "8082:8080"
    environment:
      - SPRING_CLOUD_NACOS_DISCOVERY_SERVER_ADDR=host.docker.internal:8848
      - SPRING_CLOUD_NACOS_CONFIG_SERVER_ADDR=host.docker.internal:8848
      - SPRING_DATASOURCE_URL=jdbc:mysql://${MYSQL_HOST:-mysql}:${MYSQL_PORT:-3306}/${MYSQL_DATABASE}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
      - SPRING_DATASOURCE_USERNAME=${MYSQL_USERNAME}
      - SPRING_DATASOURCE_PASSWORD=${MYSQL_PASSWORD}
      - SPRING_DATA_REDIS_HOST=${REDIS_HOST:-redis}
      - SPRING_DATA_REDIS_PORT=${REDIS_PORT}
      - JAVA_OPTS=-Xmx256m -Xms256m -Duser.timezone=Asia/Shanghai
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - sk-network
    restart: unless-stopped

  sk-order:
    build:
      context: ../SK-order/order-boot
      dockerfile: Dockerfile
    container_name: SK-order
    ports:
      - "8083:8080"
    environment:
      - SPRING_CLOUD_NACOS_DISCOVERY_SERVER_ADDR=host.docker.internal:8848
      - SPRING_CLOUD_NACOS_CONFIG_SERVER_ADDR=host.docker.internal:8848
      - SPRING_DATASOURCE_URL=jdbc:mysql://${MYSQL_HOST:-mysql}:${MYSQL_PORT:-3306}/${MYSQL_DATABASE}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
      - SPRING_DATASOURCE_USERNAME=${MYSQL_USERNAME}
      - SPRING_DATASOURCE_PASSWORD=${MYSQL_PASSWORD}
      - SPRING_DATA_REDIS_HOST=${REDIS_HOST:-redis}
      - SPRING_DATA_REDIS_PORT=${REDIS_PORT}
      - JAVA_OPTS=-Xmx256m -Xms256m -Duser.timezone=Asia/Shanghai
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - sk-network
    restart: unless-stopped

  sk-core:
    build:
      context: ../SK-core/core-boot
      dockerfile: Dockerfile
    container_name: SK-core
    ports:
      - "8081:8080"
    environment:
      - SPRING_CLOUD_NACOS_DISCOVERY_SERVER_ADDR=host.docker.internal:8848
      - SPRING_CLOUD_NACOS_CONFIG_SERVER_ADDR=host.docker.internal:8848
      - SPRING_DATASOURCE_URL=jdbc:mysql://${MYSQL_HOST:-mysql}:${MYSQL_PORT:-3306}/${MYSQL_DATABASE}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
      - SPRING_DATASOURCE_USERNAME=${MYSQL_USERNAME}
      - SPRING_DATASOURCE_PASSWORD=${MYSQL_PASSWORD}
      - SPRING_DATA_REDIS_HOST=${REDIS_HOST:-redis}
      - SPRING_DATA_REDIS_PORT=${REDIS_PORT}
      - JAVA_OPTS=-Xmx256m -Xms256m -Duser.timezone=Asia/Shanghai
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - sk-network
    restart: unless-stopped

networks:
  sk-network:
    driver: bridge
volumes:
  nacos-data:
    driver: local