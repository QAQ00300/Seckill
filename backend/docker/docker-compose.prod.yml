services:


  sk-gateway:
    build:
      context: ../SK-gateway
      dockerfile: Dockerfile
    container_name: SK-gateway
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - SPRING_DATASOURCE_REDIS_HOST=redis
      - SPRING_DATASOURCE_REDIS_PORT=6379
      - JAVA_OPTS=-Xmx256m -Xms256m -Duser.timezone=Asia/Shanghai
    depends_on:
      redis:
        condition: service_started
      mysql:
        condition: service_healthy
    networks:
      - sk-network
    restart: unless-stopped

  sk-user:
    build:
      context: ../SK-user/user-boot
      dockerfile: Dockerfile
    container_name: SK-user
    ports:
      - "8082:8080"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://${MYSQL_HOST}:${MYSQL_PORT}/${MYSQL_DATABASE}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
      - SPRING_DATASOURCE_USERNAME=${MYSQL_USERNAME}
      - SPRING_DATASOURCE_PASSWORD=${MYSQL_PASSWORD}
      - SPRING_DATA_REDIS_HOST=${REDIS_HOST}
      - SPRING_DATA_REDIS_PORT=${REDIS_PORT}
      - JAVA_OPTS=-Xmx256m -Xms256m -Duser.timezone=Asia/Shanghai
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - sk-network
    restart: unless-stopped

  sk-order:
    build:
      context: ../SK-order/order-boot
      dockerfile: Dockerfile
    container_name: SK-order
    ports:
      - "8083:8080"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://${MYSQL_HOST}:${MYSQL_PORT}/${MYSQL_DATABASE}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
      - SPRING_DATASOURCE_USERNAME=${MYSQL_USERNAME}
      - SPRING_DATASOURCE_PASSWORD=${MYSQL_PASSWORD}
      - SPRING_DATA_REDIS_HOST=${REDIS_HOST}
      - SPRING_DATA_REDIS_PORT=${REDIS_PORT}
      - JAVA_OPTS=-Xmx256m -Xms256m -Duser.timezone=Asia/Shanghai
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - sk-network
    restart: unless-stopped

  sk-core:
    build:
      context: ../SK-core/core-boot
      dockerfile: Dockerfile
    container_name: SK-core
    ports:
      - "8081:8080"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://${MYSQL_HOST}:${MYSQL_PORT}/${MYSQL_DATABASE}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
      - SPRING_DATASOURCE_USERNAME=${MYSQL_USERNAME}
      - SPRING_DATASOURCE_PASSWORD=${MYSQL_PASSWORD}
      - SPRING_DATA_REDIS_HOST=${REDIS_HOST}
      - SPRING_DATA_REDIS_PORT=${REDIS_PORT
      - JAVA_OPTS=-Xmx256m -Xms256m -Duser.timezone=Asia/Shanghai
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - sk-network
    restart: unless-stopped

volumes:
  mysql-data:
  redis-data:

networks:
  sk-network:
    driver: bridge