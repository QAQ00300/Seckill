version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: sk-mysql-test
    environment:
      MYSQL_ROOT_PASSWORD: Ppg123456
      MYSQL_DATABASE: seckill
      TZ: Asia/Shanghai
    ports:
      - "3306:3306"
    volumes:
      - mysql-test-data:/var/lib/mysql
    networks:
      - sk-test-network

  redis:
    image: redis:7-alpine
    container_name: sk-redis-test
    ports:
      - "6379:6379"
    networks:
      - sk-test-network

  nacos:
    image: nacos/nacos-server:v2.2.3
    container_name: sk-nacos-test
    environment:
      - MODE=standalone
      - SPRING_DATASOURCE_PLATFORM=mysql
      - MYSQL_SERVICE_HOST=mysql
      - MYSQL_SERVICE_DB_NAME=nacos_config
      - MYSQL_SERVICE_PORT=3306
      - MYSQL_SERVICE_USER=root
      - MYSQL_SERVICE_PASSWORD=Ppg123456
    ports:
      - "8848:8848"
      - "9848:9848"
    depends_on:
      - mysql
    networks:
      - sk-test-network

  sk-gateway:
    build:
      context: ../../SK-gateway
      dockerfile: Dockerfile
    container_name: sk-gateway-test
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=test
      - SPRING_CLOUD_NACOS_DISCOVERY_SERVER-ADDR=nacos:8848
      - SPRING_CLOUD_NACOS_CONFIG_SERVER-ADDR=nacos:8848
      - SPRING_DATA_REDIS_HOST=redis
      - JAVA_OPTS=-Xmx512m -Xms512m
    depends_on:
      - nacos
      - redis
    networks:
      - sk-test-network

  sk-user:
    build:
      context: ../../SK-user/user-boot
      dockerfile: Dockerfile
    container_name: sk-user-test
    ports:
      - "8082:8082"
    environment:
      - SPRING_PROFILES_ACTIVE=test
      - SPRING_CLOUD_NACOS_DISCOVERY_SERVER-ADDR=nacos:8848
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql:3306/seckill
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=Ppg123456
      - JAVA_OPTS=-Xmx512m -Xms512m
    depends_on:
      - mysql
      - nacos
    networks:
      - sk-test-network

  sk-order:
    build:
      context: ../../SK-order/order-boot
      dockerfile: Dockerfile
    container_name: sk-order-test
    ports:
      - "8083:8083"
    environment:
      - SPRING_PROFILES_ACTIVE=test
      - SPRING_CLOUD_NACOS_DISCOVERY_SERVER-ADDR=nacos:8848
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql:3306/seckill
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=Ppg123456
      - JAVA_OPTS=-Xmx512m -Xms512m
    depends_on:
      - mysql
      - nacos
    networks:
      - sk-test-network

  sk-core:
    build:
      context: ../../SK-core/core-boot
      dockerfile: Dockerfile
    container_name: sk-core-test
    ports:
      - "8081:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=test
      - SPRING_CLOUD_NACOS_DISCOVERY_SERVER-ADDR=nacos:8848
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql:3306/seckill
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=Ppg123456
      - JAVA_OPTS=-Xmx512m -Xms512m
    depends_on:
      - mysql
      - nacos
    networks:
      - sk-test-network

volumes:
  mysql-test-data:

networks:
  sk-test-network:
    driver: bridge